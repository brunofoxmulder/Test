name: Maison Élise tests

on:
  pull_request:
    paths:
      - "maison_elise/**"
      - "tests/test_maison_elise_*.py"
      - ".github/workflows/maison-elise-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install -r maison_elise/requirements.txt

      - name: Compile Maison Élise
        run: python -m compileall -q maison_elise/app

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_maison_elise_*.py" -v
